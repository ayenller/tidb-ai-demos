<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airport Search · TiDB AI Demos</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>✈️</text></svg>">
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2"/>
        <ellipse cx="12" cy="12" rx="4" ry="9.2"/>
        <path d="M2.8 12h18.4M4.6 6.6h14.8M4.6 17.4h14.8"/>
      </svg>
      <div>
        <h1 id="app-title"></h1>
        <p id="app-sub"></p>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <span class="badge" id="mode"></span>
    <!-- ../README.md 404s: the page is served from web/, and the FastAPI
         app mounts the same directory at "/" -->
    <a href="https://github.com/ayenller/tidb-ai-demos/tree/main/01-airport-search"
       target="_blank" rel="noopener">README</a>
  </header>

  <main>
    <section id="globe-pane">
      <canvas id="globe" role="img" aria-label="Interactive globe of the airports in this dataset"></canvas>
      <div class="globe-title"><span id="globe-title-text"></span> · <span id="globe-mode">…</span></div>
      <div class="globe-legend">
        <span><i style="background:#4ef0bb"></i><span id="lg-hub"></span></span>
        <span><i style="background:#54c8ff"></i><span id="lg-large"></span></span>
        <span><i style="background:#5b7ba1"></i><span id="lg-regional"></span></span>
      </div>
      <div class="globe-hint" id="globe-hint"></div>
      <div id="globe-tip"></div>
    </section>

    <section id="work">
      <div class="searchbar">
        <div class="field">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8397b4" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
          </svg>
          <input id="q" autocomplete="off" spellcheck="false">
          <button id="run"></button>
        </div>
        <div class="presets"></div>
      </div>

      <p class="verdict"><span class="k" id="verdict-key"></span><span id="verdict-body">…</span></p>

      <div class="cols"></div>

      <details class="sqlbar">
        <summary>
          <span id="sql-label"></span>
          <button class="sqltab" data-k="like">LIKE</button>
          <button class="sqltab" data-k="fulltext">FULLTEXT</button>
          <button class="sqltab" data-k="vector">VECTOR</button>
          <button class="sqltab" data-k="hybrid">HYBRID</button>
        </summary>
        <pre id="sql"></pre>
      </details>
    </section>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/world.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/globe.js"></script>
<script src="js/app.js"></script>
</body>
</html>
